name: NL Wallet-testomgeving

# Bouwt de NL Wallet-testomgeving (nl-wallet-omgeving/) en rolt hem op main uit naar ZAD,
# deployment `nlw` in project pm-5sj. Een PR bouwt alleen de images.

on:
  push:
    branches:
      - main
    paths:
      - nl-wallet-omgeving/**
      - .github/workflows/nl-wallet-omgeving.yml
  pull_request:
    paths:
      - nl-wallet-omgeving/**
      - .github/workflows/nl-wallet-omgeving.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      kern: ${{ steps.namen.outputs.kern }}
      proxy: ${{ steps.namen.outputs.proxy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versies en imagenamen
        id: namen
        run: |
          cat nl-wallet-omgeving/versies.env | grep -v '^#' >> "$GITHUB_ENV"
          # Als tags in het openbare moza-poc-package, zodat ZAD ze zonder inlog kan ophalen.
          # De images bevatten geen geheimen: sleutels ontstaan bij de eerste start.
          basis="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha="sha-${GITHUB_SHA::7}"
          echo "kern=${basis}:nl-wallet-${sha}" >> "$GITHUB_OUTPUT"
          echo "proxy=${basis}:nl-wallet-proxy-${sha}" >> "$GITHUB_OUTPUT"

      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout NL Wallet
        uses: actions/checkout@v4
        with:
          repository: MinBZK/nl-wallet
          ref: ${{ env.NL_WALLET_REF }}
          path: nl-wallet-omgeving/build/nl-wallet

      - name: Rust installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nl-wallet-omgeving/build/nl-wallet/wallet_core
          key: ${{ env.NL_WALLET_REF }}

      - name: Binaries bouwen
        working-directory: nl-wallet-omgeving/build/nl-wallet/wallet_core
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: bash ../../../bouw-binaries.sh ../../bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kern-image bouwen
        uses: docker/build-push-action@v6
        with:
          context: nl-wallet-omgeving
          file: nl-wallet-omgeving/Containerfile
          build-args: |
            RDO_MAX_REF=${{ env.RDO_MAX_REF }}
            BRPPROXY_IMAGE=${{ env.BRPPROXY_IMAGE }}
          push: true
          tags: ${{ steps.namen.outputs.kern }}
          cache-from: type=gha,scope=nl-wallet
          cache-to: type=gha,mode=max,scope=nl-wallet

      - name: Proxy-image bouwen
        uses: docker/build-push-action@v6
        with:
          context: nl-wallet-omgeving/proxy
          file: nl-wallet-omgeving/proxy/Containerfile
          push: true
          tags: ${{ steps.namen.outputs.proxy }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      deployments: write
    environment:
      name: nl-wallet
      url: https://nlw-pid.nlw.moza.rijksapp.nl/
    steps:
      - name: Deploy to ZAD
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: pm-5sj
          deployment-name: nlw
          components: >-
            [
              {"name": "nlw", "image": "${{ needs.build.outputs.kern }}"},
              {"name": "nlw-wp", "image": "${{ needs.build.outputs.proxy }}"},
              {"name": "nlw-static", "image": "${{ needs.build.outputs.proxy }}"},
              {"name": "nlw-ups", "image": "${{ needs.build.outputs.proxy }}"},
              {"name": "nlw-pid", "image": "${{ needs.build.outputs.proxy }}"},
              {"name": "nlw-issuance", "image": "${{ needs.build.outputs.proxy }}"},
              {"name": "nlw-verifier", "image": "${{ needs.build.outputs.proxy }}"}
            ]
