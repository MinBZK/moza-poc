name: Release build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and deploy"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ steps.tag.outputs.name }}
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
            # De tag bepaalt wat er gebouwd wordt, niet de branch waarop je de
            # workflow start. Een onderzoeksrelease hoort het prototype te tonen
            # zoals het is voorgelegd; bouwen vanaf de branch zet de laatste
            # versie op een URL waar iemand het onderzoek van maanden terug
            # verwacht.
            echo "ref=refs/tags/$RAW_TAG" >> "$GITHUB_OUTPUT"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi
          # Het voorloopnummer in de tag (1-onderzoek-…, 2-onderzoek-…) is er alleen
          # om de releaselijst op GitHub op volgorde te houden. Het hoort niet in de
          # hostname, anders verandert de URL van een onderzoek zodra de nummering
          # schuift. Strip het dus bij het bepalen van de deployment-naam.
          SAFE_NAME=$(echo "$RAW_TAG" | tr '[:upper:]' '[:lower:]' | sed 's/^[0-9][0-9]*-//' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-//;s/-$//')
          echo "name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            # Bij workflow_dispatch levert `type=ref,event=tag` niets op en wijst
            # `type=sha` naar de branch waarop je de workflow start, niet naar de
            # uitgerolde tag. Twee tags achter elkaar handmatig uitrollen schreef
            # dan hetzelfde image over. Deze tag volgt de release zelf.
            type=raw,value=release-${{ steps.tag.outputs.name }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min # Changed from mode=max

  deploy:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    needs: build
    environment:
      name: release-${{ needs.build.outputs.tag_name }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: pm-5sj
          deployment-name: release-${{ needs.build.outputs.tag_name }}
          component: proef
          image: ${{ needs.build.outputs.image }}
          wait-for-ready: true
          # Oudere releases draaien niet op nginx maar op een Python-image met de
          # host-service erin. Dat image is een orde van grootte groter, waardoor
          # het uitrollen niet binnen de standaard 300s klaar is.
          task-timeout: 900
          wait-timeout: 600
