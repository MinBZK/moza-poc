name: Production build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      nl-wallet-api: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-nl-wallet-api
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,priority=300
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Inloggen met NL Wallet: de sessie-endpoints als eigen image, een tag in hetzelfde
      # (openbare) package. Zie container/nl-wallet-api/Containerfile.
      - name: Build and push NL Wallet-API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/nl-wallet-api/Containerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-nl-wallet-api
          cache-from: type=gha,scope=nl-wallet-api
          cache-to: type=gha,mode=max,scope=nl-wallet-api

  deploy:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: pm-5sj
          deployment-name: poc
          # Twee componenten: de site (proef) en de NL Wallet-sessie-endpoints (nlw-api). Het
          # component nlw-api is eenmalig in ZAD gedefinieerd (poort 8095, env NL_WALLET_*); zie
          # server/nl-wallet/README.md.
          components: >-
            [
              {"name": "proef", "image": "${{ needs.build.outputs.image }}"},
              {"name": "nlw-api", "image": "${{ needs.build.outputs.nl-wallet-api }}"}
            ]
          wait-for-ready: true
