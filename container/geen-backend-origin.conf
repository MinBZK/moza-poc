# De chat-backend, en verder niets. Ingesloten door /chat, /health en /tools — de drie locations die
# rechtstreeks naar $backend_origin proxyen.
#
# Is die leeg, dan mist de proxy_pass-URL zijn schema en blijft alleen $request_uri over: nginx
# antwoordde daarop met een kale 500 en "invalid URL prefix in \"/chat\"" in het logboek. Bewust
# geen stille terugval op de default uit het Containerfile — wie deze variabele leegmaakt, doet dat
# expres en hoort te horen wat er dan ontbreekt.
#
# De API-routes hebben hun eigen guard op hun eigen variabele. Ze hier meenemen zou betekenen dat
# een lege BACKEND_ORIGIN /api/ platlegt terwijl BACKEND_API een werkende dienst aanwijst — precies
# de koppeling die deze PR weghaalt.
default_type text/plain;
if ($backend_origin = "") {
    return 502 "BACKEND_ORIGIN is niet gezet op deze container, dus er is geen adres van de Digitale-Assistent-backend. Zet die variabele in de omgeving en start de container opnieuw.";
}
