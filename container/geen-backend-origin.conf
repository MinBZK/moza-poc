# Bodem van de terugvalketen. Elke API-variabele valt uiteindelijk terug op $backend_origin; is die
# leeg, dan is de proxy_pass-URL leeg en antwoordt nginx met een kale 500 en "invalid URL prefix" in
# het logboek. Dat is precies de onverklaarbare fout die deze proxy elders juist wegneemt.
#
# Bewust géén stille terugval op de default uit het Containerfile: wie deze variabele leegmaakt,
# doet dat expres, en hoort te horen wat er dan ontbreekt.
default_type text/plain;
if ($backend_origin = "") {
    return 502 "BACKEND_ORIGIN is niet gezet op deze container en is de terugval van elke API-route. Zet BACKEND_ORIGIN, of de variabele die bij dit pad hoort, in de omgeving en start de container opnieuw.";
}
