# Snel falen in plaats van doorsturen naar een dienst die deze paden niet kent. De naam van de
# variabele staat in het antwoord, zodat niemand daarvoor de template hoeft terug te lezen.
#
# default_type omdat het basis-image application/octet-stream zet: dan biedt de browser deze tekst
# aan als download in plaats van hem te tonen. Let op dat dit alleen geldt zolang het laatste
# padsegment geen bekende extensie draagt — mime.types gaat vóór default_type. Voor de
# bijlage-locatie, waar het laatste segment een id uit het stelsel is, staat daarom een eigen
# guard met een lege types-tabel.
default_type text/plain;
if ($backend_keten = "") {
    return 502 "BACKEND_KETEN is niet gezet op deze container, dus er is geen adres van de berichtenuitvraag. Zet die variabele in de omgeving en start de container opnieuw.";
}
