# Snel falen in plaats van doorsturen naar een dienst die deze paden niet kent. De naam van de
# variabele staat in het antwoord, zodat niemand daarvoor de template hoeft terug te lezen.
#
# default_type omdat het basis-image application/octet-stream zet; hier alleen zodat de tekst
# leesbaar is in de netwerktab, want dit antwoord komt uitsluitend bij een fetch of de SSE-stroom
# uit het script terecht en nooit bij een bezoeker. Let op: dit geldt alleen zolang het laatste
# padsegment geen bekende extensie draagt — mime.types gaat vóór default_type. De bijlage-locatie
# heeft daarom een eigen guard met een lege types-tabel.
# De naam van de variabele ook als header, zodat de frontend een configuratiefout kan
# onderscheiden van een upstream die omvalt — dat is allebei een 502. Zonder dit kenmerk komt
# deze diagnose bij de bezoeker aan als "de bronnen reageren niet, ververs de pagina", en
# verversen helpt tegen een lege variabele nooit. `always`, want anders laat nginx de header
# bij een 5xx juist weg.
default_type text/plain;
if ($backend_keten = "") {
    add_header X-Proxy-Configuratie "BACKEND_KETEN" always;
    return 502 "BACKEND_KETEN is niet gezet op deze container, dus er is geen adres van de berichtenuitvraag. Zet die variabele in de omgeving en start de container opnieuw.";
}
