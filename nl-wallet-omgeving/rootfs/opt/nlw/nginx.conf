# Eén ingang (poort 8080) voor de hele kerncontainer. De proxy-componenten sturen het verkeer
# van hun publieke hostnaam door met de oorspronkelijke Host-header; hier gaat het op basis van
# die hostnaam naar de juiste service. Verkeer zonder publieke hostnaam komt van binnen het
# project (bijvoorbeeld MOZa) en krijgt de interne API van de verification_server en /moza.json.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stdout warn;

events {
	worker_connections 1024;
}

http {
	access_log /dev/stdout;
	client_body_temp_path /tmp/nginx-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	client_max_body_size 10m;
	proxy_read_timeout 300s;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# wallet_provider, static_server en update_policy_server doen zelf TLS met een certificaat
	# van de devenv-CA; dat verkeer blijft binnen de container.
	proxy_ssl_verify off;

	server {
		listen 8080 default_server;

		location = /moza.json {
			default_type application/json;
			alias /data/moza.json;
		}

		location = /gezond {
			default_type text/plain;
			return 200 "ok\n";
		}

		location / {
			proxy_pass http://127.0.0.1:3012;
		}
	}

	server {
		listen 8080;
		server_name ~^nlw-wp\.;
		location / {
			proxy_pass https://127.0.0.1:3000;
		}
	}

	server {
		listen 8080;
		server_name ~^nlw-static\.;
		location = /wrpac.crl.der {
			proxy_pass http://127.0.0.1:3021;
		}
		location / {
			proxy_pass https://127.0.0.1:3001;
		}
	}

	server {
		listen 8080;
		server_name ~^nlw-ups\.;
		location / {
			proxy_pass https://127.0.0.1:3002;
		}
	}

	server {
		listen 8080;
		server_name ~^nlw-pid\.;
		location / {
			proxy_pass http://127.0.0.1:3003;
		}
	}

	server {
		listen 8080;
		server_name ~^nlw-issuance\.;
		location / {
			proxy_pass http://127.0.0.1:3008;
		}
	}

	server {
		listen 8080;
		server_name ~^nlw-verifier\.;
		location / {
			proxy_pass http://127.0.0.1:3011;
		}
	}
}
