priority = 50
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:pid_issuer]
command = /opt/nlw/sbin/dienst pid_issuer wallet_server/pid_issuer
priority = 50
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:issuance_server]
