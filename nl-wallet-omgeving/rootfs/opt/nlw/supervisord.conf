; Procesbewaking van de kerncontainer. Alle logs gaan naar stdout, zodat `zad logs` ze toont.

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[unix_http_server]
file = /tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:postgres]
command = %(ENV_NLW_PGBIN)s/postgres -D %(ENV_NLW_DATA)s/pgdata -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:redis]
command = redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:migraties]
command = /opt/nlw/sbin/migraties
priority = 20
autorestart = unexpected
startsecs = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:rdo-max]
command = python -m app.main
directory = /opt/nl-rdo-max
environment = PYTHONPATH="/opt/nl-rdo-max"
priority = 30
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:brpproxy]
command = dotnet /opt/brpproxy/BrpProxy.dll
directory = /opt/brpproxy
environment = ASPNETCORE_ENVIRONMENT="Release",ASPNETCORE_URLS="http://127.0.0.1:3013",Routes__0__DownstreamScheme="http",Routes__0__DownstreamHostAndPorts__0__Host="127.0.0.1",Routes__0__DownstreamHostAndPorts__0__Port="3014"
priority = 30
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:gba_hc_converter]
command = /opt/nlw/sbin/dienst gba_hc_converter gba_hc_converter
priority = 40
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:demo_issuer]
command = /opt/nlw/sbin/dienst demo_issuer demo/demo_issuer
priority = 40
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:wallet_provider]
command = /opt/nlw/sbin/dienst wallet_provider wallet_provider
priority = 50
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:static_server]
command = /opt/nlw/sbin/dienst static_server static_server
priority = 50
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:update_policy_server]
